<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaju Reklam Sipariş Takip</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Arial;margin:0;background:#f4f5f7;color:#111}header{background:#111;color:#fff;padding:15px;display:flex;justify-content:space-between}main{max-width:800px;margin:auto;padding:12px}.card,.order{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:600}.muted{background:#eee;color:#111}.danger{background:#fee;color:#900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}.badge{float:right;background:#eee;padding:5px 8px;border-radius:20px;font-size:12px}.meta{color:#666;font-size:13px;margin-top:6px}.note{background:#f5f5f5;padding:8px;border-radius:7px;margin-top:7px;white-space:pre-wrap}.actions{display:flex;gap:7px;margin-top:9px}.login{max-width:400px;margin:12vh auto}.err{color:#a00;background:#fee;padding:8px;border-radius:7px}.ok{color:#075d28;background:#efe;padding:8px;border-radius:7px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<div id="login" class="login card"><h2>Kaju Reklam Sipariş Takip</h2><form id="lf"><label>E-posta</label><input id="email" type="email" required><label>Şifre</label><input id="pass" type="password" required><button>Giriş Yap</button><div id="lm"></div></form></div>
<div id="app" style="display:none"><header><b>Kaju Reklam Sipariş Takip</b><button id="out">Çıkış</button></header><main>
<div class="card"><h3 id="ft">Yeni Sipariş</h3><form id="of"><input id="oid" type="hidden"><div class="grid">
<div><label>Müşteri</label><input id="musteri" required></div><div><label>İş / Ürün</label><input id="urun" required></div>
<div><label>Adet</label><input id="adet" type="number" min="0"></div><div><label>Sipariş Tarihi</label><input id="sd" type="date"></div>
<div><label>Teslim Tarihi</label><input id="td" type="date"></div><div><label>Durum</label><select id="durum"><option>Sipariş Alındı</option><option>Grafik</option><option>Üretim</option><option>Hazır</option><option>Teslim Edildi</option></select></div>
<div class="full"><label>Not</label><textarea id="notlar"></textarea></div></div><button>Kaydet</button> <button type="button" class="muted" id="clear">Temizle</button><div id="fm"></div></form></div>
<input id="q" placeholder="Müşteri, ürün veya sipariş no ara..."><h3>Aktif Siparişler</h3><div id="active"></div><h3>Teslim Edilenler</h3><div id="done"></div>
</main></div>
<script>
const URL="https://dugdnyokncbgsjbrbgls.supabase.co", KEY="sb_publishable_XS_0CNEfu4FbdVenrpg0AQ_7dRB07EG";
const db=supabase.createClient(URL,KEY);let rows=[];
const $=x=>document.getElementById(x), today=()=>new Date().toISOString().slice(0,10);
function message(e,t,ok=false){$(e).innerHTML=t?'<div class="'+(ok?'ok':'err')+'">'+t+'</div>':''}
async function start(){let {data:{session}}=await db.auth.getSession();session?openApp():openLogin();db.auth.onAuthStateChange((e,s)=>s?openApp():openLogin())}
function openLogin(){$("login").style.display="block";$("app").style.display="none"}async function openApp(){$("login").style.display="none";$("app").style.display="block";if(!$("sd").value)$("sd").value=today();load()}
$("lf").onsubmit=async e=>{e.preventDefault();message("lm","");let r=await db.auth.signInWithPassword({email:$("email").value,password:$("pass").value});if(r.error)message("lm",r.error.message)}
$("out").onclick=()=>db.auth.signOut();$("q").oninput=render;$("clear").onclick=clearForm;
$("of").onsubmit=async e=>{e.preventDefault();let id=$("oid").value,p={musteri:$("musteri").value.trim(),urun:$("urun").value.trim(),adet:$("adet").value?Number($("adet").value):null,siparis_tarihi:$("sd").value||today(),teslim_tarihi:$("td").value||null,durum:$("durum").value,notlar:$("notlar").value.trim(),updated_at:new Date().toISOString()};let r=id?await db.from("siparisler").update(p).eq("id",id):await db.from("siparisler").insert(p);if(r.error)message("fm",r.error.message);else{message("fm","Kaydedildi",true);clearForm();load()}}
async function load(){let r=await db.from("siparisler").select("*").order("created_at",{ascending:false});if(r.error){$("active").innerHTML='<div class="err">'+r.error.message+'</div>';return}rows=r.data||[];render()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function card(o){return '<div class="order"><b>#'+esc(o.siparis_no)+'</b><span class="badge">'+esc(o.durum)+'</span><div><strong>'+esc(o.musteri)+'</strong></div><div>'+esc(o.urun)+(o.adet!=null?' · '+esc(o.adet)+' adet':'')+'</div><div class="meta">Sipariş: '+esc(o.siparis_tarihi||'-')+' · Teslim: '+esc(o.teslim_tarihi||'-')+'</div>'+(o.notlar?'<div class="note">'+esc(o.notlar)+'</div>':'')+'<div class="actions"><button class="muted" onclick="edit('+o.id+')">Düzenle</button><button class="danger" onclick="del('+o.id+')">Sil</button></div></div>'}
function render(){let q=$("q").value.toLowerCase(),a=rows.filter(o=>o.durum!=="Teslim Edildi"),d=rows.filter(o=>o.durum==="Teslim Edildi");if(q){let f=o=>[o.siparis_no,o.musteri,o.urun,o.notlar].some(x=>String(x??"").toLowerCase().includes(q));a=a.filter(f);d=d.filter(f)}$("active").innerHTML=a.length?a.map(card).join():"<div class='card'>Aktif sipariş yok.</div>";$("done").innerHTML=d.length?d.map(card).join():"<div class='card'>Teslim edilen sipariş yok.</div>"}
window.edit=id=>{let o=rows.find(x=>x.id===id);$("oid").value=o.id;$("musteri").value=o.musteri||"";$("urun").value=o.urun||"";$("adet").value=o.adet??"";$("sd").value=o.siparis_tarihi||today();$("td").value=o.teslim_tarihi||"";$("durum").value=o.durum;$("notlar").value=o.notlar||"";$("ft").textContent="Sipariş #"+o.siparis_no+" Düzenle";scrollTo(0,0)}
window.del=async id=>{if(confirm("Bu sipariş silinsin mi?")){let r=await db.from("siparisler").delete().eq("id",id);if(r.error)alert(r.error.message);else load()}}
function clearForm(){ $("of").reset();$("oid").value="";$("sd").value=today();$("durum").value="Sipariş Alındı";$("ft").textContent="Yeni Sipariş";message("fm","")}
start();
</script></body></html>
