<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaju Reklam Sipariş Takip</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:15px;color:#111}.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:15px}.login{max-width:420px;margin:50px auto}input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}button{background:#111;color:#fff;border:0;font-weight:bold}.gray{background:#666}.order{border:1px solid #ddd;padding:12px;border-radius:10px;margin:10px 0}.err{background:#ffe0e0;color:#900;padding:10px;border-radius:8px;margin-top:10px}.ok{background:#e0ffe5;color:#070;padding:10px;border-radius:8px;margin-top:10px}
</style></head><body>
<div id="login" class="login card"><h2>Kaju Reklam Sipariş Takip</h2><form id="loginForm"><input id="email" type="email" placeholder="E-posta" required><input id="password" type="password" placeholder="Şifre" required><button type="submit">Giriş Yap</button><div id="loginMsg"></div></form></div>
<div id="app" style="display:none"><div class="card"><h2>Kaju Reklam Sipariş Takip</h2><button id="logout" class="gray">Çıkış Yap</button></div>
<div class="card"><h3>Yeni Sipariş</h3><form id="orderForm"><input id="musteri" placeholder="Müşteri" required><input id="urun" placeholder="İş / Ürün" required><input id="adet" type="number" placeholder="Adet"><label>Sipariş Tarihi</label><input id="siparisTarihi" type="date"><label>Teslim Tarihi</label><input id="teslimTarihi" type="date"><select id="durum"><option>Sipariş Alındı</option><option>Grafik</option><option>Üretim</option><option>Hazır</option><option>Teslim Edildi</option></select><textarea id="notlar" placeholder="Not"></textarea><button type="submit">Siparişi Kaydet</button><div id="orderMsg"></div></form></div>
<div class="card"><input id="search" placeholder="Müşteri, ürün veya sipariş no ara"></div><div class="card"><h3>Aktif Siparişler</h3><div id="active">Yükleniyor...</div></div><div class="card"><h3>Teslim Edilenler</h3><div id="done">Yükleniyor...</div></div></div>
<script>
const SUPABASE_URL="https://dugdnyokncbgsjbrbgls.supabase.co",KEY="sb_publishable_XS_0CNEfu4FbdVenrpg0AQ_7dRB07EG";let db,orders=[];const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);
function msg(id,text,ok=false){$(id).innerHTML=text?'<div class="'+(ok?'ok':'err')+'">'+text+'</div>':''}function showLogin(){$("login").style.display="block";$('app').style.display="none"}async function showApp(){$("login").style.display="none";$('app').style.display="block";if(!$('siparisTarihi').value)$('siparisTarihi').value=today();await loadOrders()}
async function start(){try{if(!window.supabase)throw new Error('Supabase bağlantısı yüklenemedi.');SUPABASE_URL;const r=await db.auth.getSession();if(r.error)throw r.error;r.data.session?showApp():showLogin();db.auth.onAuthStateChange((e,s)=>s?showApp():showLogin())}catch(e){showLogin();msg('loginMsg','Bağlantı hatası: '+e.message)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('loginMsg','');try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)msg('loginMsg','Giriş başarısız: '+r.error.message)}catch(e){msg('loginMsg','Hata: '+e.message)}};$('logout').onclick=()=>db.auth.signOut();
$('orderForm').onsubmit=async e=>{e.preventDefault();msg('orderMsg','');const order={musteri:$('musteri').value.trim(),urun:$('urun').value.trim(),adet:$('adet').value?Number($('adet').value):null,siparis_tarihi:$('siparisTarihi').value||null,teslim_tarihi:$('teslimTarihi').value||null,durum:$('durum').value,notlar:$('notlar').value.trim()};try{const r=await db.from('siparisler').insert(order);if(r.error)throw r.error;msg('orderMsg','Sipariş başarıyla kaydedildi.',true);$('orderForm').reset();$('siparisTarihi').value=today();await loadOrders()}catch(e){msg('orderMsg','Sipariş kaydedilemedi: '+e.message)}};
async function loadOrders(){const r=await db.from('siparisler').select('*').order('id',{ascending:false});if(r.error){$('active').innerHTML='<div class="err">'+r.error.message+'</div>';return}orders=r.data||[];render()}
function render(){const q=$('search').value.toLowerCase().trim(),list=orders.filter(o=>String(o.siparis_no||'').toLowerCase().includes(q)||String(o.musteri||'').toLowerCase().includes(q)||String(o.urun||'').toLowerCase().includes(q)),active=list.filter(o=>o.durum!=='Teslim Edildi'),done=list.filter(o=>o.durum==='Teslim Edildi');$('active').innerHTML=active.length?active.map(card).join(''):'Aktif sipariş yok.';$('done').innerHTML=done.length?done.map(card).join(''):'Teslim edilen sipariş yok.'}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function card(o){return '<div class="order"><b>Sipariş No: #'+esc(o.siparis_no)+'</b><br><br><b>Müşteri:</b> '+esc(o.musteri)+'<br><b>İş / Ürün:</b> '+esc(o.urun)+'<br><b>Adet:</b> '+esc(o.adet)+'<br><b>Sipariş Tarihi:</b> '+esc(o.siparis_tarihi)+'<br><b>Teslim Tarihi:</b> '+esc(o.teslim_tarihi)+'<br><b>Durum:</b> '+esc(o.durum)+'<br><b>Not:</b> '+esc(o.notlar)+'</div>'}
$('search').oninput=render;start();
</script></body></html>
